# Build static site and deploy to GitHub Pages at https://medikue.com
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages (medikue.com)
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE: /
        run: npm run build

      - name: SPA fallback for client-side routes
        run: cp dist/client/index.html dist/client/404.html

      - name: Ensure custom domain CNAME
        run: echo "medikue.com" > dist/client/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
